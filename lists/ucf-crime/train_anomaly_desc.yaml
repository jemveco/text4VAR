Abuse: Abuse is an abnormal event that involves intentional harmful behavior directed toward another person and typically unfolds through clear interpersonal interaction. It often attracts attention because the victim shows distress, avoidance, or attempts to escape. The aggressor repeatedly intimidates, pushes, strikes, or forcefully restrains the victim in places such as homes, schools, workplaces, or public spaces, creating sustained physical or psychological harm.

Arrest: An arrest is an unusual event involving direct interaction between multiple people, where actions are deliberate, coordinated, and often draw the attention of nearby individuals. Participants move purposefully within a defined area as the situation rapidly develops. Law enforcement officers physically restrain, handcuff, or escort a suspect, who may comply, resist, or attempt to flee before being taken into custody.

Arson: Arson is an abnormal event characterized by deliberate actions that create hazardous conditions and quickly alter the surrounding environment. The behavior usually develops over a short period before escalating into a dangerous situation affecting nearby people or property. An individual intentionally ignites combustible materials, producing visible flames, smoke, and rapidly spreading fire that damages buildings, vehicles, or outdoor structures.

Assault: Assault is an abnormal event involving intentional aggressive interaction between people that disrupts normal activity and creates immediate danger. The participants remain in close proximity while their movements become rapid, forceful, and confrontational. One individual deliberately attacks another through punching, kicking, striking with objects, or other violent actions, often causing the victim to fall, defend themselves, or retreat.

Burglary: Burglary is an abnormal event involving unauthorized actions performed with deliberate intent inside or around private property. The behavior usually occurs discreetly, with individuals attempting to avoid attention while moving cautiously through the scene. An offender unlawfully enters a residence, business, or restricted building by forcing access or exploiting unsecured entrances before searching for valuables to steal.

Explosion: An explosion is an abnormal event that rapidly transforms a previously ordinary environment into a hazardous scene through sudden, high-energy physical changes. The event causes immediate disruption, drawing attention from nearby people who often react by fleeing or seeking safety. A violent blast produces intense light, smoke, debris, and shockwaves that damage surrounding structures, vehicles, or infrastructure within seconds.

Fighting: Fighting is an abnormal event involving direct physical confrontation between multiple individuals, producing chaotic movements and attracting attention from people nearby. Participants remain engaged through continuous aggressive interaction as the conflict rapidly escalates. Both sides exchange punches, kicks, shoves, or grappling actions, often chasing, restraining, or knocking each other down while bystanders intervene or attempt to separate them.

Road Accidents: A road accident is an abnormal event that disrupts the normal flow of traffic and creates immediate risks for everyone in the surrounding area. The scene changes suddenly as nearby drivers, pedestrians, or cyclists react to the incident. Vehicles collide with other vehicles, pedestrians, roadside objects, or infrastructure, often leaving damaged vehicles, scattered debris, abrupt stops, and injured individuals requiring assistance.

Robbery: Robbery is an abnormal event involving intentional criminal interaction where force, intimidation, or threats are used against another person. The encounter is direct, fast, and highly stressful, often provoking fear and attempts to escape or resist. An offender confronts the victim to seize money, valuables, or personal belongings through physical violence or coercion before quickly fleeing the location.

Shooting: A shooting is an abnormal event involving sudden violent actions that immediately endanger nearby people and cause widespread panic. The environment changes rapidly as individuals seek cover, flee, or react to loud and unexpected sounds. A firearm is discharged toward one or more targets, producing visible weapon handling, muzzle flashes, rapid movements, and potentially injured victims within the scene.

Shoplifting: Shoplifting is an abnormal event involving intentional unauthorized actions carried out inside a commercial retail environment while attempting to avoid detection. The individual behaves cautiously, frequently monitoring employees, security staff, or surveillance cameras. The offender conceals merchandise in clothing, bags, or personal belongings before bypassing payment areas and attempting to leave the store without paying.

Stealing: Stealing is an abnormal event involving deliberate unauthorized removal of another person's property through opportunistic or planned actions. The offender often acts quickly while attempting to remain unnoticed or exploit moments when the owner is distracted. Items such as bags, bicycles, packages, or personal belongings are secretly taken from public or private locations without direct confrontation.

Vandalism: Vandalism is an abnormal event involving intentional destructive behavior that damages property and disrupts the normal appearance or function of a location. The actions are purposeful and often occur without regard for the consequences to others. An individual deliberately breaks windows, sprays graffiti, damages vehicles, destroys public infrastructure, or defaces buildings using force, tools, or paint, leaving visible and lasting damage.
