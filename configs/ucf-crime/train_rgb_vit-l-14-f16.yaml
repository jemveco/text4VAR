# pretrain: exp_sota/k400/ViT-L/14/f16/last_model.pt
# pretrain: checkpoints/k400-vitb-32-f16.pt
resume:
seed: 1024
projector: embeddings/clip/no_reduce/mean_cls/embeddings_normalized_clip_ViT-L-14_nr.pt
#reductor: embeddings/clip/pca_192/mean_class-text/clip_ViT-L-14_pca-model_192.pt
data:
    dataset: ucf-crime
    modality: RGB
    num_segments: 16
    seg_length: 1
    batch_size: 8
    workers: 0
    num_classes: 13
    image_tmpl: frame_{}.jpg
    train_root: /run/media/dpimn/DataBase/Emilio/UCF_Crime/UCF_Crime/Images/
    val_root: /run/media/dpimn/DataBase/Emilio/UCF_Crime/UCF_Crime/Images/
    train_list: lists/ucf-crime/train.yaml
    val_list: lists/ucf-crime/val.yaml
    label_list: lists/ucf_crime_labels.csv
    input_size: 224
    random_shift: True
network:
    arch: ViT-L/14  #ViT-B/32 ViT-B/16
    init: True
    drop_out: 0.0
    emb_dropout: 0.0
    type: clip_ucf
    sim_header: Transf
    drop: 0
solver:
    type: cosine
    epochs: 30
    start_epoch: 0
    optim: adamw
    lr: 2.e-5
    lr_warmup_step: 5
    weight_decay: 1.e-2
    loss_type: CE
    evaluate: False
    clip_ratio: 0.1
    grad_accumulation_steps: 1
logging:
    print_freq: 10
    eval_freq: 5
